<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
</head>
<body class="bg-light">

    <!-- Cabeçalho -->
    <header>
        <img src="../img/mine.jpg" alt="Imagem de título" class="img-fluid w-100 d-block">
        <div class="bg-dark text-white py-4 border-bottom border-success border-4">
            <div class="container">
                <div class="row align-items-center g-3">
                    <div class="col-lg-8">
                        <span class="badge bg-success mb-2">Mundo Aberto</span>
                        <span class="badge bg-info text-dark mb-2">Sobrevivência</span>
                        <span class="badge bg-warning text-dark mb-2">Criativo</span>
                        <h1 class="display-5 fw-bold mb-1">Universo Minecraft</h1>
                        <p class="lead text-secondary mb-0">Explore, construa e crie sem limites em um mundo feito de blocos.</p>
                    </div>
                    <div class="col-lg-4 text-lg-end">
                        <a href="#modos" class="btn btn-success me-2">Ver Modos</a>
                        <a href="#contato" class="btn btn-outline-light">Fale Conosco</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Menu de Navegação !-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-info" href="#inicio">Minecraft</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link text-info" href="#inicio">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-info" href="#historia">Sobre</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-info" href="#mundo">Mundo Infinito</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-info" href="#modos">Modos de Jogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-info" href="#educacao">Educação</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-info" href="#contato">Contato</a>
                    </li>
                </ul>
                <button type="button" class="btn btn-outline-info btn-sm" data-bs-toggle="modal" data-bs-target="#modalResumo">
                    Ficha Rápida
                </button>
            </div>
        </div>
    </nav>
</body>
</html>
